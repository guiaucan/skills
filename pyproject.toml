[project]
name = "harness"
version = "0.1.0"
description = "Harness de agentes e skills (MCP)"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness-mcp = "harness.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
